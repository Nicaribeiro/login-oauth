<!doctype html>
<html lang="pt-BR">
 <head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Laboratório de autenticação</title>
 <style>
   * { box-sizing: border-box; }
   body {
     margin: 0;
     min-height: 100vh;
     display: flex;
     align-items: center;
     justify-content: center;
     background: #0f172a;
     font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
     padding: 24px;
   }
   main {
     background: #ffffff;
     color: #1e293b;
     width: 100%;
     max-width: 360px;
     padding: 32px 28px;
     border-radius: 16px;
     box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
     text-align: center;
   }
   h1 { font-size: 1.3rem; margin: 0 0 8px; }
   #status { color: #64748b; font-size: 0.9rem; margin: 0 0 24px; }
   a.provider-button {
     display: flex;
     align-items: center;
     justify-content: center;
     width: 100%;
     padding: 12px;
     margin-bottom: 12px;
     border-radius: 8px;
     text-decoration: none;
     font-weight: 600;
     font-size: 0.95rem;
     border: 1px solid #d1d5db;
   }
   a.provider-button:hover { opacity: 0.85; }
   .google-button { background: #ffffff; color: #1e293b; }
   .github-button { background: #24292f; color: #ffffff; border-color: #24292f; }
   #logout-form { margin-top: 8px; }
   #logout-form button {
     width: 100%;
     padding: 10px;
     border-radius: 8px;
     border: 1px solid #ef4444;
     background: transparent;
     color: #ef4444;
     font-weight: 600;
     font-size: 0.9rem;
     cursor: pointer;
   }
   #logout-form button:hover { background: #ef4444; color: #fff; }
 </style>
 </head>
 <body>
 <main>
 <h1>Laboratório de autenticação</h1>
 <p id="status">A sessão ainda não foi consultada.</p>

 <a href="/oauth/login/google" class="provider-button google-button">Entrar com Google</a>
 <a href="/oauth/login/github" class="provider-button github-button">Entrar com GitHub</a>

   <form method="post" action="/oauth/logout" id="logout-form">
   <button type="submit">Sair</button>
 </form>
 </main>
 <script src="/app.js"></script>
 </body>
</html>
